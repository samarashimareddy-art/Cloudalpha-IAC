name: Terraform Destroy (demo cleanup)

# Manual only: deletes everything infra/ created (VPC, subnet, IGW, route
# table, security group, key pair, EC2 instance, S3 bucket). The Terraform
# state bucket, the IAM role and the OIDC provider are NOT touched.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm deleting all demo AWS resources'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Terraform Destroy (AWS us-east-1)
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739572512568:role/github-actions-cloudalpha-iac
          aws-region: us-east-1
          role-session-name: github-actions-cloudalpha-iac

      - name: Terraform init
        run: terraform init

      - name: Show what will be deleted
        run: terraform plan -destroy -out=destroy.tfplan

      - name: Terraform destroy
        run: terraform apply -auto-approve destroy.tfplan
