name: Terraform CI/CD Pipeline
on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read
jobs:
  security-scan:
    name: Security & SAST Scans
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run GitLeaks secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json
      - name: Run Trivy misconfiguration scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            aquasec/trivy:latest fs --scanners vuln,misconfig,secret --severity CRITICAL,HIGH --exit-code 0 --no-progress \
            .
      - name: Run SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=samarashimareddy-art_Cloudalpha-IAC -Dsonar.organization=samarashimareddy-art -Dsonar.host.url=https://sonarcloud.io

  terraform:
    name: Terraform Plan & Apply
    needs: security-scan
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://console.aws.amazon.com/
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739572512568:role/github-actions-cloudalpha-iac
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      - name: Terraform Init (S3 backend)
        run: terraform init
        # If backend config flags are needed, add them here (e.g. -backend-config)
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -out=tfplan
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
      - name: Terraform Apply (manual approval)
        run: terraform apply tfplan
