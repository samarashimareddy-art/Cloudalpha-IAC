name: Terraform CI/CD Pipeline for Cloudalpha-IAC

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Infrastructure Pipeline
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/samarashimareddy-art/Cloudalpha-IAC/environments/production
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739572512568:role/github-actions-cloudalpha-iac
          aws-region: us-east-1
          role-session-name: github-actions-cloudalpha-iac
          mask-aws-account-id: true

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Cloudalpha-IAC
            -Dsonar.organization=samarashimareddy-art
            -Dsonar.host.url=https://sonarcloud.io

      - name: Post SonarQube scan results to platform
        run: |
          curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
            -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
            -d @.scannerwork/report-task.txt
        continue-on-error: true

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init
        # S3 backend is implied; if backend config is needed, add flags like: --backend-config="bucket=<bucket>" --backend-config="key=<key>" --backend-config="region=<region>"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan

      - name: Secret scan with Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json

      - name: Post Gitleaks scan results to platform
        run: |
          curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
            -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
            -d @infra/gitleaks-report.json
        continue-on-error: true

      - name: Terraform apply (manual approval required)
        if: github.ref == 'refs/heads/main'
        run: terraform apply tfplan
        env:
          # Only runs after manual approval via GitHub Environment 'production'
          # No AWS access keys used; OIDC authentication only
          # Ensure reviewers are set in GitHub Environment settings
