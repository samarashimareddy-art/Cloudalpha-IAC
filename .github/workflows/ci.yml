name: Terraform CI/CD for Cloudalpha-IAC
on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read
jobs:
  terraform:
    name: Terraform Pipeline
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/samarashimareddy-art/Cloudalpha-IAC
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739572512568:role/github-actions-cloudalpha-iac
          aws-region: us-east-1
          role-session-name: github-actions-cloudalpha-iac-session
          mask-aws-account-id: true
      - name: Set up Terraform
        run: |
          curl -sSL https://releases.hashicorp.com/terraform/$(curl -sSL https://releases.hashicorp.com/terraform/ | grep -oP 'terraform/\K[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)/terraform_$(curl -sSL https://releases.hashicorp.com/terraform/ | grep -oP 'terraform/\K[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)_linux_amd64.zip -o terraform.zip
          unzip terraform.zip
          sudo mv terraform /usr/local/bin/
          terraform version
      - name: Terraform format check
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init
        # S3 backend is implied; backend config flags may be required if not in infra/main.tf
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        run: terraform plan -out=tfplan
      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
      - name: Manual approval before apply
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v6
        with:
          script: |
            // This step gates apply behind GitHub Environment 'production' required reviewers
            // Approval is handled by GitHub Environment
            console.log('Waiting for manual approval in production environment...')
      - name: Terraform apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=cloudalpha-iac -Dsonar.organization=samarashimareddy-art -Dsonar.host.url=https://sonarcloud.io

      - name: Post SonarQube scan results
        run: |
          curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
            -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
            -d @.scannerwork/report-task.txt
      - name: Install and run GitLeaks secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json
      - name: Post GitLeaks scan results
        run: |
          curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
            -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
            -d @gitleaks-report.json
      - name: Run Trivy security scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
        continue-on-error: true
      - name: Post Trivy scan results
        run: |
          curl -X POST https://ai-devops.apx-cloudalpha.com/api/v1/security/scan-results \
            -H "X-API-Key: ${{ secrets.PLATFORM_API_KEY }}" \
            -d @trivy-report.json
