# .github/workflows/terraform-destroy.yml
name: Terraform Destroy Pipeline
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DESTROY to confirm destruction of infrastructure.'
        required: true
        default: ''
jobs:
  terraform-destroy:
    if: ${{ github.event.inputs.confirm == 'DESTROY' }}
    name: Terraform Destroy (Production)
    environment:
      name: production
      # Ensure required reviewers are set in the GitHub Environment settings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    permissions:
      id-token: write
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739572512568:role/github-actions-cloudalpha-iac
          aws-region: us-east-1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Run SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=samarashimareddy-art_Cloudalpha-IAC -Dsonar.organization=samarashimareddy-art -Dsonar.host.url=https://sonarcloud.io

      - name: Run secret scan with Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Terraform Init (with S3 backend)
        run: terraform init
        # S3 backend configuration is read from infra/terraform files
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan Destroy
        run: terraform plan -destroy -out=destroy.tfplan
      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: destroy-tfplan
          path: infra/destroy.tfplan
      - name: Terraform Apply Destroy Plan (Manual Approval via Environment)
        run: terraform apply destroy.tfplan
