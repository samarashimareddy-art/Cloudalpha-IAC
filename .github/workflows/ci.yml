name: Cloudalpha-IAC CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

# id-token: write lets the Terraform job exchange GitHub's OIDC token for
# temporary AWS credentials (role github-actions-cloudalpha-iac) - no access keys.
permissions:
  id-token: write
  contents: read

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check (lint)
        working-directory: app
        run: npm run lint

      - name: GitLeaks secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 1 --report-path gitleaks-report.json

      - name: SonarCloud scan (runs only when SONAR_TOKEN is configured)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=Cloudalpha-IAC
            -Dsonar.organization=samarashimareddy-art
            -Dsonar.host.url=https://sonarcloud.io

  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    needs: static-analysis
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: app
          tags: cloudalpha-demo-app:${{ github.sha }}
          load: true
          push: false

      - name: Trivy image scan (report only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL,HIGH --exit-code 0 --no-progress \
            cloudalpha-demo-app:${{ github.sha }}

  # Runs on every branch and PR, without AWS access: catches Terraform errors
  # on dev before anything is merged to main.
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  terraform:
    name: Terraform Deploy (AWS us-east-1)
    runs-on: ubuntu-latest
    needs: [docker-build, terraform-validate]
    # The IAM role only trusts the main branch, so AWS deploys never run for pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739572512568:role/github-actions-cloudalpha-iac
          aws-region: us-east-1
          role-session-name: github-actions-cloudalpha-iac

      - name: Show AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
