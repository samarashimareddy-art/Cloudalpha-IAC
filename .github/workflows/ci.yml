name: Terraform CI/CD for Cloudalpha-IAC

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: GitLeaks secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 1 --report-path gitleaks-report.json

      - name: Trivy IaC / filesystem scan (report only)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs --scanners misconfig,vuln,secret --severity CRITICAL,HIGH --exit-code 0 /src

      - name: SonarCloud scan (runs only when SONAR_TOKEN is configured)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=cloudalpha-iac
            -Dsonar.organization=samarashimareddy-art
            -Dsonar.host.url=https://sonarcloud.io

  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    needs: security-scans
    environment:
      name: production
      url: https://github.com/samarashimareddy-art/Cloudalpha-IAC
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::739572512568:role/github-actions-cloudalpha-iac
          aws-region: us-east-1
          role-session-name: github-actions-cloudalpha-iac

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
